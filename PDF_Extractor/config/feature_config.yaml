# PAIMANA Feature Engineering & Validation Configuration

# Thresholds for Physical-Financial Relationship & Anomaly Flags
thresholds:
  # Gap between expenditure ratio (%) and physical progress (%) to flag mismatch
  physical_financial_gap_threshold_pct: 15.0
  
  # High expenditure threshold (%)
  high_expenditure_threshold_pct: 70.0
  
  # Low progress threshold (%)
  low_progress_threshold_pct: 30.0
  
  # Stagnation threshold: progress change less than this percentage across 3 months
  stagnation_progress_threshold_pct: 0.5
  
  # Cost overrun threshold to trigger warning
  cost_overrun_warning_pct: 10.0

# Trend Analysis Configuration
trend_analysis:
  # Minimum observations needed for linear trend slope calculation
  min_observations_for_slope: 3
  
  # Months lookback for rolling velocities
  velocity_3m_months: 3
  velocity_6m_months: 6

# Risk Signal Evaluation Rules
risk_rules:
  progress_deterioration: true
  progress_stagnation: true
  physical_financial_mismatch: true
  high_expenditure_low_progress: true
  increasing_cost_overrun: true
  schedule_extended: true
  schedule_overdue: true

